name: CLAIMSYNC checks

concurrency:
  group: claimsync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  backend-tests:
    name: Test Express API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Run API tests
        working-directory: backend
        run: npm test

  browser-e2e:
    name: Browser end-to-end auth flow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claimsync
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: claimsync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimsync -d claimsync"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply database schema
        env:
          DATABASE_URL: postgresql://claimsync:devpassword@localhost:5432/claimsync
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/schema.sql
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start app and test real browser flow
        env:
          DATABASE_URL: postgresql://claimsync:devpassword@localhost:5432/claimsync
          PORT: 5000
          FRONTEND_ORIGIN: http://localhost:5173
          NODE_ENV: test
          JWT_SECRET: ci-only-claimsync-test-secret-long-enough
          VITE_API_URL: http://localhost:5000
        run: |
          (cd backend && npm start > /tmp/claimsync-api.log 2>&1) &
          (npm run dev -- --host 127.0.0.1 > /tmp/claimsync-ui.log 2>&1) &
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:5000/health >/dev/null && curl -fsS http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Application failed to start"
            cat /tmp/claimsync-api.log
            cat /tmp/claimsync-ui.log
            exit 1
          fi
          node tests/e2e-auth.mjs

  docker-build:
    name: Validate Docker deployment
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-123456
      JWT_SECRET: ci-only-claimsync-docker-secret-at-least-32-chars
      FRONTEND_ORIGINS: http://localhost:8080
      VITE_API_URL: /api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production API image
        run: docker build -f backend/Dockerfile -t claimsync-api:local .
      - name: Build production frontend image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=/api -t claimsync-web:local .
      - name: Start full stack
        run: docker compose up -d --no-build
      - name: Smoke test frontend and proxied API
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ >/dev/null && curl -fsS http://localhost:8080/api/health | grep -q '"database":"connected"'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs
            exit 1
          fi
      - name: Stop full stack
        if: always()
        run: docker compose down -v
